<!-- Login ekrani -->
<div id="loginScreen" class="login-wrap hidden">
  <div class="login-card soft">
    <img src="/img/logo.png" alt="">
    <h2 data-i18n="adm.loginTitle"></h2>
    <p>Hamyon</p>
    <div class="field">
      <input type="password" class="input" id="loginPass" data-i18n-ph="adm.password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn" data-i18n="adm.signIn"></button>
  </div>
</div>

<!-- Admin panel -->
<div id="adminApp" class="admin hidden">
  <aside class="sidebar soft">
    <div class="brand"><img src="/img/logo.png" alt=""><b id="admBrand">Hamyon</b></div>
    <button class="nav-item active" data-section="dash"><svg><use href="#a-dash"/></svg><span data-i18n="adm.navDash"></span></button>
    <button class="nav-item" data-section="settings"><svg><use href="#a-set"/></svg><span data-i18n="adm.navSettings"></span></button>
    <button class="nav-item" data-section="users"><svg><use href="#a-users"/></svg><span data-i18n="adm.navUsers"></span></button>
    <button class="nav-item" data-section="orders"><svg><use href="#a-ord"/></svg><span data-i18n="adm.navOrders"></span></button>
    <button class="nav-item" data-section="catalog"><svg><use href="#a-cat"/></svg><span data-i18n="adm.navCatalog"></span></button>
    <button class="nav-item" data-section="texts"><svg><use href="#a-txt"/></svg><span data-i18n="adm.navTexts"></span></button>
    <button class="nav-item" data-section="images"><svg><use href="#a-img"/></svg><span data-i18n="adm.navImages"></span></button>
    <div class="spacer"></div>
    <button class="nav-item" id="openSiteBtn"><svg><use href="#a-cat"/></svg><span data-i18n="adm.openSite"></span></button>
    <button class="nav-item" id="admLogout"><svg><use href="#a-out"/></svg><span data-i18n="c.logout"></span></button>
  </aside>

  <main class="admin-main">
    <header class="admin-top soft">
      <h1 id="admTitle"></h1>
      <select class="input" id="admLang" style="width:auto;padding:9px 12px">
        <option value="uz">O'zbekcha</option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
      <button class="icon-btn" id="admThemeBtn">
        <svg class="sun-ic"><use href="#a-sun"/></svg>
        <svg class="moon-ic hidden"><use href="#a-moon"/></svg>
      </button>
    </header>
    <div id="adminContent"></div>
  </main>
</div>

<div id="toasts"></div>

<script src="/js/core.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
