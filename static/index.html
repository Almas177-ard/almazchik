<head>

<!-- Boot ekrani -->
<div id="boot" class="boot-screen">
  <img src="/img/logo.png" alt="">
  <div class="soft-inset" style="width:180px;height:14px;border-radius:10px"></div>
</div>

<!-- Ilova -->
<div id="app" class="app hidden">
  <header class="topbar soft">
    <img id="brandLogo" class="brand-logo" src="/img/logo.png" alt="">
    <div class="brand-name" id="brandName">Hamyon</div>
    <button class="icon-btn" id="themeBtn" aria-label="theme">
      <svg class="sun-ic"><use href="#i-sun"/></svg>
      <svg class="moon-ic hidden"><use href="#i-moon"/></svg>
    </button>
  </header>

  <main>
    <section id="page-home" class="page active"></section>
    <section id="page-catalog" class="page"></section>
    <section id="page-wallet" class="page"></section>
    <section id="page-orders" class="page"></section>
    <section id="page-profile" class="page"></section>
  </main>

  <nav class="tabbar soft" id="tabbar">
    <button class="tab active" data-tab="home"><svg><use href="#i-home"/></svg><span data-i18n="nav.home"></span></button>
    <button class="tab" data-tab="catalog"><svg><use href="#i-grid"/></svg><span data-i18n="nav.catalog"></span></button>
    <button class="tab" data-tab="wallet"><svg><use href="#i-wallet"/></svg><span data-i18n="nav.wallet"></span></button>
    <button class="tab" data-tab="orders"><svg><use href="#i-receipt"/></svg><span data-i18n="nav.orders"></span></button>
    <button class="tab" data-tab="profile"><svg><use href="#i-user"/></svg><span data-i18n="nav.profile"></span></button>
  </nav>
</div>

<div id="toasts"></div>

<script src="/js/core.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
